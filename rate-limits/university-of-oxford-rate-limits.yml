description: 'The University of Oxford publishes no rate-limit table, no quota and no Retry-After header
  on any institution-operated surface, and none was observed in probing. What it does publish, uniquely
  for ORA, is an etiquette policy in prose: harvesters wanting all or a large sample of the repository
  are asked to contact the service first, and Oxford states that unexpected spidering or scraping may
  lead to access being blocked. That is a social control enforced by a human decision, not a technical
  limit a client can read. Separately, ora.ox.ac.uk sits behind Cloudflare and issues managed challenges
  (HTTP 403, cf-mitigated: challenge) to non-browser clients on some paths — bot mitigation rather than
  rate limiting, but the practical failure mode a naive client will hit first.'
notes: No 429 was observed on any surface. The throttled response code below is the protocol default,
  recorded as an expectation rather than as an observation.

responseCodes:
  throttled: 429
limits:
- name: ORA OAI-PMH
  scope: client
  metric: unspecified
  limit: none published
  notes: Oxford asks bulk harvesters to make contact first (https://ora.ox.ac.uk/api). Scheduled maintenance
    Tuesdays 07:00-09:00 UK time may return 503.
- name: ORA search / object JSON
  scope: client
  metric: unspecified
  limit: none published
  notes: Undocumented endpoint; no limit stated. robots.txt disallows /?q*, /?f*, /?page* and /export_csv_search_results,
    which is the closest thing to a stated automation boundary.
- name: Digital Bodleian IIIF
  scope: client
  metric: unspecified
  limit: none published
  notes: Image API info.json advertises maxWidth 4000 and maxHeight 4000 — a per-request size ceiling,
    not a rate limit.
- name: Oxford Text Archive OAI-PMH
  scope: client
  metric: unspecified
  limit: none published
policies:
- name: Contact before bulk harvest
  description: Oxford explicitly asks would-be bulk downloaders of ORA to get in touch so the service
    can advise on approach.
- name: Backoff Strategy
  description: No Retry-After is emitted anywhere; clients should apply exponential backoff with jitter
    on their own initiative and respect the published Tuesday maintenance window.

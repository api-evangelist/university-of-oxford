- aid: university-of-oxford:sds-figshare-tenancy
  name: Sustainable Digital Scholarship research data portal (Figshare tenancy)
  x-operator: tenant
  x-operator-evidence: >-
    portal.sds.ox.ac.uk CNAMEs to proxy-eu-01.figshare.com. The DataCite repository client figshare.oxford,
    name "University of Oxford", has minted 155,787 DOIs under the 10.25446/oxford prefix, and those DOIs
    resolve to portal.sds.ox.ac.uk article pages.
  description: >-
    Oxford's research data portal runs on Figshare under an Oxford-owned hostname. The data, the DOI prefix
    and the collection are Oxford's; the contract, the API and the engineering are Figshare's. No Figshare
    specification is stored in this repository — that is exactly the misattribution this cohort was re-profiled
    to remove — and the relationship is recorded here instead, which is the correct place for it. Note
    also a false lead worth leaving on the record: oxford.figshare.com appears to resolve, but *.figshare.com
    is a wildcard and a deliberately nonsensical subdomain returns the identical AWS WAF challenge, so
    that host is NOT evidence of anything. The tenancy is at portal.sds.ox.ac.uk.
  humanURL: https://portal.sds.ox.ac.uk/
  baseURL: https://portal.sds.ox.ac.uk/api
  tags:
  - Research Data
  - Research Repository
  - Tenant
  - Figshare
  properties:
  - type: Website
    url: https://portal.sds.ox.ac.uk/
  - type: Vendor
    url: https://figshare.com/
- aid: university-of-oxford:solo-primo-tenancy
  name: SOLO library discovery (Ex Libris Primo VE tenancy)
  x-operator: tenant
  x-operator-evidence: >-
    solo.bodleian.ox.ac.uk CNAMEs to oxford.primo.exlibrisgroup.com and redirects to a Primo VE discovery
    view with the institution code vid=44OXF_INST:SOLO.
  description: >-
    The Bodleian Libraries' discovery layer is Ex Libris Primo VE. Any Primo or Alma REST API reachable
    under this tenancy is Ex Libris's contract governing Oxford's holdings, not an Oxford API. Recorded
    as a relationship; no Ex Libris specification is stored here.
  humanURL: https://solo.bodleian.ox.ac.uk/

aid: university-of-oxford
name: University of Oxford
description: >-
  The University of Oxford is a collegiate public research university in Oxford, United
  Kingdom, and a Russell Group member. It operates no central developer programme, no API
  portal, no developer account and no authenticated API of any kind — and the one it used to
  run, the Open Data Service at data.ox.ac.uk with OxPoints linked data, places, courses and
  vacancies over REST and SPARQL, was decommissioned without a successor; that domain and the
  Mobile Oxford API host no longer resolve. What Oxford does operate, entirely inside its
  library and research-infrastructure estate, is more substantial than that absence suggests:
  the Bodleian Libraries run a conformant IIIF stack at iiif.bodleian.ox.ac.uk (Image API 2.1
  level 2, Presentation API 2.1 and a Change Discovery 1.0 activity stream over 21,843 items),
  two independent OAI-PMH data providers (ORA and the Oxford Text Archive), an undocumented but
  live JSON search API over the institutional repository, and a Shibboleth identity provider
  registered in the UK Access Management Federation and eduGAIN alongside 35 federated service
  providers across central IT, departments and colleges. Four of the twelve education-regime
  domain standards are evidenced directly in what those endpoints return: OAI-PMH, DataCite,
  ORCID and SAML/Shibboleth. Set against that, four significant surfaces carrying Oxford's name
  are vendor contracts running under a tenancy and are recorded here as such rather than
  credited to the University: the Sustainable Digital Scholarship research data portal at
  portal.sds.ox.ac.uk is Figshare, SOLO is Ex Libris Primo VE, the VLE is Instructure Canvas,
  and recruitment is CoreHR. Nothing Oxford operates is documented with a machine-readable
  contract; every OpenAPI and schema in this repository was derived by API Evangelist from live
  responses and is marked as such.

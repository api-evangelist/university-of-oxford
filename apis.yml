    url: https://canvas.ox.ac.uk/doc/api/
  - type: Website
    url: https://canvas.ox.ac.uk/
  - type: Vendor
    url: https://www.instructure.com/
- aid: university-of-oxford:recruit-corehr-tenancy
  name: Oxford recruitment (CoreHR tenancy)
  x-operator: tenant
  x-operator-evidence: >-
    www.recruit.ox.ac.uk redirects to my.corehr.com/pls/uoxrecruit/erq_search_package.search_form?p_company=10
    — a CoreHR-hosted application under an Oxford-specific path, not an Oxford host.
  description: >-
    Vacancies were once part of Oxford's own open-data programme; they are now a CoreHR application reached
    through an Oxford vanity hostname. The redirect target leaves the ox.ac.uk domain entirely, which
    makes this the weakest of Oxford's four tenancies — Oxford does not even own the host the user lands
    on. There is no callable API here at all: my.corehr.com/pls/uoxrecruit is a server-side web form that
    403s any client arriving without the redirect from recruit.ox.ac.uk, so no API base URL is claimed
    for it.
  humanURL: https://www.recruit.ox.ac.uk/
  baseURL: https://www.recruit.ox.ac.uk/

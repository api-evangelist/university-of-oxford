- aid: university-of-oxford:canvas-tenancy
  name: Oxford Canvas VLE (Instructure tenancy)
  x-operator: tenant
  x-operator-evidence: canvas.ox.ac.uk CNAMEs to universityofoxford-vanity.instructure.com.
  description: >-
    Oxford's virtual learning environment, replacing the retired WebLearn Sakai service. The Canvas LMS
    REST API and Canvas's LTI and Caliper conformance belong to Instructure. The Canvas REST API is live
    under Oxford's hostname and returns 401 unauthenticated, and Instructure's own API reference is served
    at canvas.ox.ac.uk/doc/api/ — an Oxford host serving a vendor's contract, which is the tenant case
    in miniature. Recorded as a relationship precisely so that Instructure's LTI certification is never
    counted as an Oxford domain-standard conformance — see the not-claimed section of conformance/university-of-oxford-domain-standards.yml.
  humanURL: https://canvas.ox.ac.uk/doc/api/
  baseURL: https://canvas.ox.ac.uk/api/v1/accounts
  tags:

x-coverage:
  state: covered
  reason: institution_operated_surfaces_verified
  detail: >-
    Every surface in this profile was probed live on 2026-08-19 and its operator settled before
    anything was saved. Six institution-operated surfaces were confirmed on University of
    Oxford registrable domains and four vendor tenancies were identified and recorded as
    relationships rather than as Oxford's contracts. Oxford publishes no machine-readable API
    contract anywhere, so the four OpenAPI documents and three JSON Schemas in this repository
    are DERIVED from live responses and marked method: derived; the payloads they were derived
    from are stored verbatim in examples/. Two limits on this coverage are worth stating. First,
    the entire www.ox.ac.uk web estate sits behind a Cloudflare managed challenge and returns
    403 with cf-mitigated: challenge to every non-browser client, including
    /.well-known/security.txt — those hosts are LIVE and bot-mitigated, not dead, and any
    surface documented only in prose on that estate could not be machine-read. Second,
    portal.sds.ox.ac.uk and the Figshare platform behind it return an AWS WAF challenge, so the
    tenancy was settled by DNS (CNAME to proxy-eu-01.figshare.com) and by the DataCite registry
    (client figshare.oxford, 155,787 DOIs resolving to portal.sds.ox.ac.uk) rather than by
    reading the portal itself. A third limit is about our tooling rather than about Oxford, and
    is recorded so it is not rediscovered the hard way: audit-university-contracts.py classifies
    by registrable domain, so it reads portal.sds.ox.ac.uk, canvas.ox.ac.uk and
    www.recruit.ox.ac.uk as institution-operated. All three are vendor tenancies behind vanity
    hostnames, and because a vanity hostname is unique to one institution it can never trip the
    script's cohort-shared-host test for `vendor` either. Three of Oxford's four tenancies sit in
    that blind spot; only SOLO, which points at oxford.primo.exlibrisgroup.com, is caught. The
    x-operator values in this file were settled by DNS resolution and are authoritative over the
    script's hostname heuristic.
  evidence:
    - url: https://ora.ox.ac.uk/oai2?verb=Identify
      status: 200
    - url: https://ora.ox.ac.uk/objects.json?q=climate
      status: 200
    - url: https://iiif.bodleian.ox.ac.uk/
      status: 200
    - url: https://iiif.bodleian.ox.ac.uk/iiif/activity/all-changes
      status: 200
    - url: https://ota.bodleian.ox.ac.uk/repository/oai/request?verb=Identify
      status: 200
    - url: https://idp.shibboleth.ox.ac.uk/idp/shibboleth
      status: 200
    - url: https://lifelong-learning.ox.ac.uk/wp-json/wp/v2/
      status: 200
    - url: https://www.ox.ac.uk/
      status: 403
      note: Cloudflare managed challenge, cf-mitigated:challenge — live, not dead.
    - url: https://ora.ox.ac.uk/objects/opensearch.xml
      status: 403
      note: Cloudflare managed challenge on an OpenSearch descriptor Oxford links from its own API page.
    - url: https://portal.sds.ox.ac.uk/
      status: 202
      note: AWS WAF challenge (x-amzn-waf-action:challenge) on the Figshare tenancy.
    - url: https://data.ox.ac.uk/
      status: 0
      note: Decommissioned Open Data Service — no A/AAAA record.
    - url: https://api.m.ox.ac.uk/
      status: 0
      note: Decommissioned Mobile Oxford API — NXDOMAIN.
apis:
- aid: university-of-oxford:shibboleth-idp
  name: University of Oxford Shibboleth Identity Provider
  x-operator: institution
  x-operator-evidence: >-
    Registered in eduGAIN as https://registry.shibboleth.ox.ac.uk/idp, IDPSSODescriptor, display name
    "University of Oxford", registration authority http://ukfederation.org.uk. An identity provider is
    institution-operated by definition — it asserts the institution's own identities.
  description: >-
    A SAML 2.0 identity provider serving live machine-readable metadata, with Redirect/SSO, POST/SSO,
    POST-SimpleSign/SSO, POST/SLO and SOAP/Redirect/SLO bindings and a signing certificate rotated 2026-05-15.
    Oxford is registered in the UK Access Management Federation and eduGAIN with one production and two
    test identity providers, plus 35 service providers spanning central IT, departments and colleges —
    All Souls, Worcester, Lincoln, Keble, St Hilda's, Brasenose, Exeter, St John's, Continuing Education,
    NDORMS, Structural Biology, Statistics and the Text Archive among them. Caveat recorded rather than
    hidden: the document served at the metadata URL is the Shibboleth software's built-in self-description
    and still carries the product's default placeholder display name and an internal node entityID; the
    federation registration, not that document, is the authoritative identity.
  humanURL: https://technical.edugain.org/entities
  baseURL: https://idp.shibboleth.ox.ac.uk/idp
  tags:
  - Identity Federation
  - SAML
  - Shibboleth
  - eduGAIN
  properties:
  - type: Metadata
    url: https://idp.shibboleth.ox.ac.uk/idp/shibboleth
  - type: Conformance
    url: conformance/university-of-oxford-domain-standards.yml
